<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>FriggaFrio Mapa</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f5f8fa;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    id="map-frame"
    allowfullscreen
    referrerpolicy="origin"
    loading="lazy"
    title="Google Maps FriggaFrio"
  ></iframe>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var q = params.get('q') || 'Alameda Glete, 663, Campos Elíseos, São Paulo - SP, 01215-001';
      var key = params.get('key') || 'AIzaSyCwz5MOUVxL3l-Pkt61obsrSnaDy3t9NtY';
      var frame = document.getElementById('map-frame');
      if (frame) {
        frame.src = 'https://www.google.com/maps/embed/v1/place?key=' + encodeURIComponent(key) + '&q=' + encodeURIComponent(q);
      }
    })();
  </script>
</body>
</html>
