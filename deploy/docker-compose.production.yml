version: "3.8"

services:
  backend:
    image: frigga-backend:latest
    build:
      context: ../
      dockerfile: apps/backend/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
      - PAYMENTS_ENABLED=false
      - PAYMENT_PROVIDER_ENABLED=false
      - MERCADO_PAGO_ACCESS_TOKEN=${MERCADO_PAGO_ACCESS_TOKEN}
      - MERCADO_PAGO_WEBHOOK_SECRET=${MERCADO_PAGO_WEBHOOK_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - STORE_CORS=https://www.friggafrio.com.br,https://friggafrio.com.br
      - ADMIN_CORS=https://admin.friggafrio.com.br
      - AUTH_CORS=https://admin.friggafrio.com.br,https://www.friggafrio.com.br
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  storefront:
    image: frigga-storefront:latest
    build:
      context: ../
      dockerfile: apps/storefront/Dockerfile
    restart: always
    environment:
      - VITE_MEDUSA_BACKEND_URL=${VITE_MEDUSA_BACKEND_URL:-https://api.friggafrio.com.br}
    # Porta 80 exposta internamente para o NGINX reverso (que cuida do tráfego público)
    expose:
      - 80
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-frigga}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frigga"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Porta NÃO exportada para fora
    expose:
      - 5432

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Porta NÃO exportada para fora
    expose:
      - 6379

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
      - storefront

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres-data:
  redis-data:
